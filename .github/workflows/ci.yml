name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Compile-check every .py file — fails the workflow on syntax errors.
      - name: Byte-compile (syntax check)
        run: python -m compileall -q candela.py

      # Build the package so wheel/version metadata is always valid.
      - name: Build package
        run: |
          python -m pip install --quiet --upgrade pip build
          python -m build
        working-directory: .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/