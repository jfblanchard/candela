name: Release to PyPI

# Publishes to PyPI automatically whenever a version tag like v0.1.4 is pushed.
# Usage:  git tag v0.1.4 && git push origin v0.1.4
#
# Requires a GitHub repository secret named PYPI_API_TOKEN containing a PyPI
# API token with "Upload new releases" scope for the candela-ctrl package
# (https://pypi.org/manage/account/token/).

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # for PyPI trusted publishing (optional; uses token otherwise)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --quiet --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}